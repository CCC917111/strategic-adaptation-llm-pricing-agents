[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "llm-pricing-oversight"
version = "0.1.0"
description = "Reproduction code for an LLM pricing-agent oversight experiment"
requires-python = ">=3.11"

[project.optional-dependencies]
openai = [
    "openai",
    "pydantic>=2",
]
gemini = [
    "google-genai>=2.3.0",
    "pydantic>=2",
]
plot = [
    "matplotlib>=3.9",
]

[tool.setuptools.packages.find]
where = ["src"]
