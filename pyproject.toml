[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "strategic-adaptation-llm-pricing-agents"
version = "0.1.0"
description = "Experiments on LLM pricing adaptation under hidden demand change"
requires-python = ">=3.11"

[project.optional-dependencies]
gemini = [
    "google-genai>=2.3.0",
    "pydantic>=2",
]
test = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
