[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "strategic-adaptation-llm-pricing-agents"
version = "0.1.0"
description = "Reference experiments for stateful LLM pricing in dynamic markets"
requires-python = ">=3.11"

[project.optional-dependencies]
gemini = [
    "google-genai>=2.3.0",
    "pydantic>=2",
]
compatible = ["httpx>=0.27", "pydantic>=2"]
test = ["pytest>=8"]
plots = ["matplotlib>=3.8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
